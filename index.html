<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathQuest – Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e6f1ff;--bg2:#fff6d6;--ink:#14275e;--muted:#4b5a85;--card:#fff;--line:#c9d8f5;--brand:#2f5bd8;--sun:#ffc531;--field:#f1f5ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1c45;--bg2:#2a2350;--ink:#eef3ff;--muted:#b3c1ea;--card:#17265a;--line:#2f4486;--field:#0f1c45}}
:root[data-theme="dark"]{--bg1:#0f1c45;--bg2:#2a2350;--ink:#eef3ff;--muted:#b3c1ea;--card:#17265a;--line:#2f4486;--field:#0f1c45}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 600px at 25% 40%,var(--bg1),transparent 70%),radial-gradient(700px 500px at 85% 90%,var(--bg2),transparent 70%),var(--bg1);overflow-x:hidden}
.page{min-height:100vh;display:grid;grid-template-columns:1fr auto;align-items:center;gap:32px;max-width:1180px;margin:0 auto;padding:24px 32px;position:relative}
.stage{position:relative;display:flex;justify-content:center}
.stage img{width:min(620px,100%);height:auto;display:block;animation:bob 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(20,39,94,.18))}
@keyframes bob{50%{transform:translateY(-10px)}}
.sym{position:absolute;font:800 34px 'Baloo 2',sans-serif;opacity:.55;animation:float 6s ease-in-out infinite}
.s1{left:2%;top:12%;color:var(--sun)}.s2{right:4%;top:6%;color:var(--brand);animation-delay:-2s}.s3{left:6%;bottom:22%;color:#2fa36b;animation-delay:-4s}.s4{right:2%;bottom:30%;color:#7a63e0;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-14px) rotate(8deg)}}
.card{width:300px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 34px rgba(20,39,94,.16)}
.card h1{font:800 22px 'Baloo 2',sans-serif;margin:0;color:var(--brand);line-height:1.1}
.card p.sub{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs button{font:700 13px 'Nunito',sans-serif;padding:8px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
input{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:600 14px 'Nunito',sans-serif}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.go{width:100%;margin-top:14px;padding:10px;border:0;border-radius:12px;background:var(--sun);color:#14275e;font:800 15px 'Baloo 2',sans-serif;cursor:pointer;box-shadow:0 3px 0 #d99a00}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #d99a00}
.forgot{display:block;margin-top:10px;font-size:12px;color:var(--brand);font-weight:700}
#nameRow{display:none}.reg #nameRow{display:block}.reg .forgot{display:none}
.msg{min-height:16px;margin-top:8px;font-size:12px;color:var(--muted)}
@media (max-width:820px){.page{grid-template-columns:1fr;justify-items:center;padding:16px;gap:12px;align-content:start}.stage img{width:min(300px,78%)}.sym{font-size:26px}.card{width:min(340px,100%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><main class="page">
<section class="stage" aria-label="Maskot MathQuest">
<span class="sym s1" aria-hidden="true">+</span><span class="sym s2" aria-hidden="true">×</span><span class="sym s3" aria-hidden="true">−</span><span class="sym s4" aria-hidden="true">÷</span>
<img src="assets/mascot.png" alt="MathQuest – Belajar Matematika, Raih Masa Depan, Kelas 8">
</section>
<section class="card" id="card" aria-label="Masuk atau daftar">
<h1>MathQuest</h1><p class="sub">Belajar matematika jadi lebih seru.</p>
<div class="tabs" role="tablist"><button role="tab" aria-selected="true" id="tL">Masuk</button><button role="tab" aria-selected="false" id="tR">Daftar</button></div>
<div id="nameRow"><label for="nm">Nama</label><input id="nm" autocomplete="name"></div>
<label for="em">Email</label><input id="em" type="email" autocomplete="email">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<button class="go" id="go" type="button">Masuk</button>
<div class="msg" id="msg" role="status"></div>
<a class="forgot" href="#" id="fg">Lupa password?</a>
</section></main>
<script>
const c=document.getElementById('card'),L=document.getElementById('tL'),R=document.getElementById('tR'),go=document.getElementById('go'),m=document.getElementById('msg');
function mode(r){c.classList.toggle('reg',r);L.setAttribute('aria-selected',!r);R.setAttribute('aria-selected',r);go.textContent=r?'Daftar':'Masuk';m.textContent=''}
L.onclick=()=>mode(false);R.onclick=()=>mode(true);
go.onclick=()=>{m.textContent=document.getElementById('em').value&&document.getElementById('pw').value?'Sambungkan ke sistem login kamu di sini.':'Isi email dan password dulu ya.'};
document.getElementById('fg').onclick=e=>e.preventDefault();
</script></body></html>
