<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINE CITY - Build Your Math World</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2a5e;--mu:#5d6c9c;--bg:#e8f1ff;--blue:#3b82f6;--blue2:#1d4ed8;--sky:#5cc8ff;--pur:#8b5cf6;--pur2:#6d3fe0;--mint:#34d399;--mint2:#14a373;--sun:#ffd23f;--sun2:#f2a900;--pink:#ff7eb6;--tom:#ff5d6c;--ok:#22c58b;--bad:#ff4d6d;--edge:#1b2a5e26;--head:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif}

body{overflow-x:hidden}

.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:4px 0 12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font:700 20px var(--head);cursor:pointer;background:none;border:0;color:var(--ink)}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(180deg,#a78bfa,var(--pur));display:grid;place-items:center;box-shadow:0 4px 0 var(--pur2),inset 0 2px 0 #ffffff88}.logo svg{width:26px;height:26px}
.nav{display:flex;gap:6px;flex:1;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none;min-width:0}.nav::-webkit-scrollbar{display:none}

.nav button.on{background:linear-gradient(180deg,#a78bfa,var(--pur));color:#fff;box-shadow:0 3px 0 var(--pur2),inset 0 2px 0 #ffffff66}
h1,h2,h3{font-family:var(--head);line-height:1.1;font-weight:600}
.btn{font:800 16px var(--body);border:0;border-radius:16px;padding:12px 20px;cursor:pointer;color:#fff;text-shadow:0 2px 0 #0003;background:linear-gradient(180deg,#ffe066,var(--sun) 40%,var(--sun2));color:#5a3d00;text-shadow:none;box-shadow:0 6px 0 #b27a00,0 12px 18px #f2a90044,inset 0 2px 0 #ffffffaa;transition:transform .12s,filter .12s}

.btn.big{padding:15px 32px;font-size:19px}.btn.sm{padding:8px 13px;font-size:13px}
.btn.bl{color:#fff;text-shadow:0 2px 0 #0003;background:linear-gradient(180deg,#7cb4ff,var(--blue) 55%,var(--blue2));box-shadow:0 6px 0 #1739a0,0 12px 18px #3b82f644,inset 0 2px 0 #ffffff88}
.btn.mt{color:#fff;text-shadow:0 2px 0 #0003;background:linear-gradient(180deg,#8af0c8,var(--mint) 55%,var(--mint2));box-shadow:0 6px 0 #0c7a58,inset 0 2px 0 #ffffff88}
.btn.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #1b2a5e22,inset 0 0 0 2.5px var(--edge)}.btn.sm.ghost{box-shadow:0 4px 0 #1b2a5e22,inset 0 0 0 2.5px var(--edge)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.glass{background:#fff;border:3px solid #fff;border-radius:22px;box-shadow:0 7px 0 #1b2a5e1c,0 16px 30px #1b2a5e14,inset 0 0 0 2px #1b2a5e10}
.pad{padding:16px}
.tag{display:inline-block;font:800 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:linear-gradient(180deg,#8af0c8,var(--mint2));border-radius:99px;padding:6px 14px;box-shadow:0 3px 0 #0c7a58,inset 0 2px 0 #ffffff66;text-shadow:0 1px 0 #0003}
.land{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:center;min-height:470px}
.land h1{font-size:clamp(50px,9vw,88px);margin:12px 0 4px;color:#fff;text-shadow:0 3px 0 var(--blue2),0 6px 0 var(--blue2),0 9px 0 #14308a,0 14px 22px #1b2a5e44}

.sub{font:600 21px var(--head);color:var(--pur2)}.land p{margin:12px 0 20px;color:#2c3f7a;max-width:480px;line-height:1.55}
.how{margin-top:16px;color:var(--mu);font-size:14px;max-width:480px}.how summary{cursor:pointer;font-weight:800}.how ul{padding-left:20px;margin-top:8px;line-height:1.55}

.bar{height:16px;border-radius:9px;background:#e9efff;box-shadow:inset 0 2px 3px #1b2a5e33;overflow:hidden;border:2px solid #fff}.bar i{display:block;height:100%;background:linear-gradient(180deg,#9cf0d2,var(--mint) 60%,var(--mint2));border-radius:9px;transition:width .5s}.bar.pu i{background:linear-gradient(180deg,#c4b0ff,var(--pur) 60%,var(--pur2))}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.tile2{padding:14px;text-align:left;cursor:pointer;border:0;font-family:var(--body);color:var(--ink);border-radius:20px;background:#fff;box-shadow:0 6px 0 #1b2a5e22;transition:transform .15s}.tile2:hover{transform:translateY(-4px)}.tile2 b{display:block;font:600 18px var(--head);margin:6px 0 2px}.tile2 span{font-size:12.5px;color:var(--mu)}.tile2 .ic{width:46px;height:46px}.tile2 .ic svg{width:100%;height:100%}
.pg h2{font-size:30px;margin:4px 0 4px}.pg>.sm{margin-bottom:12px}
.mapbox{border-radius:26px;overflow:hidden;border:4px solid #fff;box-shadow:0 8px 0 #1b2a5e22,0 18px 30px #1b2a5e14;background:#9be8c4}.mapbox svg{display:block;width:100%;height:auto}
.zone{cursor:pointer}.zone:hover .zart{transform:translateY(-4px)}.zart{transition:transform .2s;transform-box:fill-box}.zone.lock{cursor:not-allowed}

.alist{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.ac{padding:10px;border-radius:18px;background:#fff;box-shadow:0 5px 0 #1b2a5e20;text-align:left;border:0;cursor:pointer;font-family:var(--body);color:var(--ink)}.ac .n{font:700 12px var(--head);color:var(--pur2);letter-spacing:.08em}.ac h3{font-size:16px;margin:2px 0}.ac .s{font-size:12.5px;color:var(--mu)}.ac.lock{filter:grayscale(.7);opacity:.7;cursor:not-allowed}.ac.cur{box-shadow:0 0 0 3px var(--sun),0 5px 0 3px #f2a90077}
.brief{padding:16px}.brief h2{font-size:28px}.goals{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.goals div{flex:1;min-width:90px;background:#f1f6ff;border-radius:16px;padding:8px 10px;text-align:center;box-shadow:inset 0 0 0 2.5px var(--edge)}.goals b{display:block;font:700 24px var(--head);color:var(--pur2)}.goals span{font-size:12px;color:var(--mu)}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;margin-bottom:12px}.hud .nm{font:600 17px var(--head);flex:1;min-width:150px}.hud .nm small{display:block;font:700 12px var(--body);color:var(--mu)}
.hud .it{display:flex;align-items:center;gap:5px;font:800 15px var(--body);background:#fff4d6;border-radius:12px;padding:6px 10px;box-shadow:inset 0 -3px 0 #ffd23f66}.hud .it svg{width:18px;height:18px}.hud .tm.low{color:var(--bad);animation:bl 1s infinite}@keyframes bl{50%{opacity:.5}}
.stage{position:relative;border-radius:26px;overflow:hidden;border:4px solid #fff;background:#fbfdff;box-shadow:0 8px 0 #1b2a5e22,0 18px 30px #1b2a5e14}
.scene{display:block;width:100%;height:230px}
.track{display:flex;align-items:center;justify-content:center;padding:12px 14px 4px}
.nd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--body);background:#fff;color:var(--mu);flex:none;box-shadow:0 3px 0 #1b2a5e22,inset 0 0 0 2.5px var(--edge)}
.nd.on{background:radial-gradient(circle at 35% 30%,#8af0b0,var(--ok));color:#fff;box-shadow:0 3px 0 #168a5d,inset 0 2px 0 #ffffff88}.nd.cur{background:#fff3c4;color:#b27a00;box-shadow:0 0 0 4px #ffd23f88,inset 0 0 0 2.5px var(--sun2)}
.ln{height:5px;flex:1;max-width:44px;background:#1b2a5e18;border-radius:3px}.ln.on{background:var(--ok)}
.say{display:flex;gap:12px;align-items:center;padding:12px 16px}.say .bub{background:#fff;border-radius:18px;padding:11px 15px;font-size:14.5px;line-height:1.45;box-shadow:0 4px 0 #1b2a5e1c,inset 0 0 0 2.5px var(--edge)}
.qcard{margin:0 14px 16px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 0 #1b2a5e1c,inset 0 0 0 3px #5cc8ff}
.qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}.qtag{font:700 12px var(--head);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--pur);padding:3px 10px;border-radius:99px}
.qtext{font:700 17px/1.5 var(--body);margin:6px 0 10px}.qfig{display:flex;justify-content:center;margin:4px 0}
.opts{display:grid;gap:9px}.opts.two{grid-template-columns:1fr 1fr}
.opt{font:800 16px var(--body);color:var(--ink);text-align:center;padding:13px;border-radius:15px;border:0;background:linear-gradient(180deg,#fff,#eef3ff);cursor:pointer;box-shadow:0 5px 0 #1b2a5e26,inset 0 0 0 2.5px var(--edge)}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 0 #1b2a5e26,inset 0 0 0 2.5px var(--blue)}.opt:active:not(:disabled){transform:translateY(3px)}
.opt.ok{background:linear-gradient(180deg,#d9fbe8,#b4f0cf);box-shadow:0 5px 0 #1c8a5266,inset 0 0 0 2.5px var(--ok)}.opt.no{background:linear-gradient(180deg,#ffe3e8,#ffc7d1);box-shadow:0 5px 0 #d9355566,inset 0 0 0 2.5px var(--bad)}.opt:disabled{cursor:default}
.inrow{display:flex;gap:8px;align-items:center}.inrow input{flex:1;font:800 20px var(--body);padding:12px 14px;border-radius:15px;border:0;background:#f1f6ff;color:var(--ink);min-width:0;box-shadow:inset 0 3px 5px #1b2a5e22,inset 0 0 0 2.5px var(--edge)}.inrow .u{color:var(--mu);font-weight:800}
.fb{margin-top:12px;border-radius:15px;padding:10px 13px;font-size:14.5px;line-height:1.5;background:#f1f6ff;box-shadow:inset 0 0 0 2.5px var(--edge)}.fb.ok{background:#e2fbee;box-shadow:inset 0 0 0 2.5px #22c58b88}.fb.no{background:#fff0f3;box-shadow:inset 0 0 0 2.5px #ff4d6d77}.fb b{color:var(--pur2)}
.qnext{margin-top:12px;display:flex;justify-content:flex-end;gap:8px}
.pl{display:block;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto;border-radius:16px;background:#fff;box-shadow:0 0 0 3px #fff,0 0 0 5px #1b2a5e1f;touch-action:none;user-select:none}.pl.mini{max-width:120px}.pl.act{cursor:crosshair}
.rd{text-align:center;font:600 18px var(--head);color:var(--pur2);margin:8px 0;min-height:26px}
.sl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0}.sl label{font:700 16px var(--head);min-width:70px}.sl output{font:700 16px var(--head);min-width:48px;text-align:right;color:var(--pur2)}
input[type=range]{width:100%;accent-color:#8b5cf6;height:30px}
.mt2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.mi{border:0;background:#f1f6ff;border-radius:16px;padding:8px;cursor:pointer;display:grid;place-items:center;min-height:58px;font:800 16px var(--body);color:var(--ink);box-shadow:0 4px 0 #1b2a5e22,inset 0 0 0 2.5px var(--edge)}.mi.sel{box-shadow:0 4px 0 var(--pur2),inset 0 0 0 3px var(--pur);background:#efe9ff}.mi.done{background:#d9fbe8;box-shadow:inset 0 0 0 2.5px var(--ok);cursor:default}.mi.shk{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.eqrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;font:600 26px var(--head);margin:10px 0}
.slot{min-width:52px;height:48px;border-radius:13px;background:#f1f6ff;box-shadow:inset 0 3px 5px #1b2a5e22,inset 0 0 0 2.5px var(--pur);display:grid;place-items:center;padding:0 8px;cursor:pointer}.slot.hv{background:#efe9ff}
.bank{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:52px}.tl{min-width:52px;height:48px;border:0;border-radius:13px;font:700 22px var(--head);color:#fff;background:linear-gradient(180deg,#a78bfa,var(--pur));box-shadow:0 5px 0 var(--pur2),inset 0 2px 0 #ffffff66;cursor:grab;touch-action:none;padding:0 10px}.tl.in{background:linear-gradient(180deg,#7cb4ff,var(--blue));box-shadow:0 3px 0 var(--blue2)}.tl.gh{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
.res{text-align:center;padding:26px 16px}.res h2{font-size:34px;margin:6px 0}.res .rch{width:140px;margin:0 auto -6px;filter:drop-shadow(0 6px 0 #1b2a5e26)}.stars{font-size:44px;color:var(--sun);letter-spacing:6px;margin:8px 0;text-shadow:0 3px 0 var(--sun2)}.stars .o{color:#1b2a5e22;text-shadow:none}
.rows{display:grid;gap:6px;max-width:340px;margin:14px auto;text-align:left}.rows div{display:flex;justify-content:space-between;background:#f1f6ff;border-radius:13px;padding:9px 13px}.rows .t{background:#fff0bf;box-shadow:inset 0 0 0 2.5px var(--sun)}.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bdg{padding:14px 10px;border-radius:20px;background:#fff;text-align:center;box-shadow:0 5px 0 #1b2a5e20}.bdg .ic{width:56px;height:56px;margin:0 auto 6px}.bdg .ic svg{width:100%;height:100%}.bdg b{display:block;font:600 15px var(--head)}.bdg span{font-size:12px;color:var(--mu)}.bdg.off{filter:grayscale(1);opacity:.5}
.prow{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:2px dashed #1b2a5e18}.prow:last-child{border:0}.prow b{font:600 16px var(--head)}
.lcard{padding:16px;margin-bottom:14px}.lcard h3{font-size:22px;margin-bottom:6px}.lcard p{line-height:1.55;margin:6px 0}.lcard .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.step{background:#f1f6ff;border-radius:14px;padding:9px 13px;margin:7px 0;font-size:15px;line-height:1.5;box-shadow:inset 0 0 0 2.5px var(--edge)}.step.ok{background:#e2fbee}
.mini-top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}.mini-top b{font:700 22px var(--head)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mg{padding:16px}.mg h3{font-size:22px;margin:4px 0}
@media(max-width:900px){.tiles,.stats{grid-template-columns:1fr 1fr}.alist{grid-template-columns:1fr 1fr}.badges{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:700px){.land{grid-template-columns:1fr;min-height:0}.hero{order:-1}.lcard .two,.mgrid{grid-template-columns:1fr}.prow{grid-template-columns:1fr}.badges{grid-template-columns:1fr 1fr}.top{gap:6px}}
@media(max-width:600px){.scene{height:auto;aspect-ratio:560/190}.avs{grid-template-columns:repeat(3,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class="sky" id="sky" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <button class="brand" id="bHome" type="button" aria-label="Beranda LINE CITY"><span class="logo" id="logo" aria-hidden="true"></span>LINE CITY</button>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
    <button class="btn ghost sm" id="bSound" type="button" aria-pressed="true">Suara: nyala</button>
  </header>
  <main id="main">
    <section id="sLand"></section><section id="sProf" hidden></section><section id="sDash" hidden></section>
    <section id="sMap" hidden></section><section id="sPlay" hidden></section><section id="sMini" hidden></section><section id="sAch" hidden></section><section id="sProg" hidden></section><section id="sRes" hidden></section>
  </main>
</div>
<script>
(() => {
'use strict'
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)]
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), pick = a => a[rnd(0, a.length - 1)]
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i);[a[i], a[j]] = [a[j], a[i]] } return a }
let U = 0; const uid = () => 'u' + (++U)
const KEY = 'mq_line_city_v1'
const ang = v => v < 0 ? '−' + (-v) : String(v)
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a)
const fr = (n, d = 1) => { if (d < 0) { n = -n; d = -d } const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? ang(n) : `${n < 0 ? '−' : ''}${Math.abs(n)}/${d}` }
const mx = (n, d) => { if (n === 0) return ''; const s = n < 0 ? '−' : '', a = Math.abs(n); return d === 1 ? (a === 1 ? s + 'x' : s + a + 'x') : (a === 1 ? `${s}x/${d}` : `${s}${a}x/${d}`) }
const eq = (n, d, c) => { const g = gcd(n, d) || 1; n /= g; d /= g; if (d < 0) { n = -n; d = -d } const m = mx(n, d); return !m ? `y = ${ang(c)}` : `y = ${m}${c === 0 ? '' : c > 0 ? ' + ' + c : ' − ' + (-c)}` }
const rp = n => 'Rp' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.')
const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
const NAMA = ['', 'Coordinate Park', 'Gradient Hill', 'Equation Center', 'Graph Academy', 'Line Challenge']

/* ---------- state ---------- */
const S0 = () => ({ name: '', av: 0, best: {}, unlocked: 1, coins2: 0, mxp: 0, learn: {}, mini: {}, tot: { ok: 0, no: 0 } })
let S = S0()
try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && j.best) S = Object.assign(S0(), j) } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) {} }
const ping = m => { try { if (parent !== window) parent.postMessage({ mq: 'linecity', ...m }, '*') } catch (e) {} }
let sound = true, ac

/* ---------- bidang koordinat ---------- */
const lineEnds = (m, c, r, s) => { const N = (2 * r + 2) * s, h = N / 2, x1 = -r - 1, x2 = r + 1; return [h + x1 * s, h - (m * x1 + c) * s, h + x2 * s, h - (m * x2 + c) * s] }
const plane = (o = {}) => {
  const r = o.r || 6, s = o.s || (o.mini ? 30 : 22), N = (2 * r + 2) * s, h = N / 2, X = x => h + x * s, Y = y => h - y * s, id = uid()
  let g = ''
  for (let i = -r; i <= r; i++) g += `<path d="M${X(i)} ${Y(-r)}V${Y(r)}M${X(-r)} ${Y(i)}H${X(r)}" stroke="${i ? '#c9d6f5' : '#1b2a5e'}" stroke-width="${i ? 1 : 2.2}"/>`
  g += `<path d="M${X(r) + 2} ${h - 5}l9 5-9 5zM${h - 5} ${Y(r) - 2}l5-9 5 9z" fill="#1b2a5e"/><text x="${X(r) + 4}" y="${h + 20}" font-family="Fredoka,sans-serif" font-size="12" fill="#1b2a5e">x</text><text x="${h + 12}" y="${Y(r) - 2}" font-family="Fredoka,sans-serif" font-size="12" fill="#1b2a5e">y</text>`
  if (!o.mini) for (let i = -r; i <= r; i++) if (i) g += `<text x="${X(i)}" y="${h + 13}" text-anchor="middle" font-family="Nunito,sans-serif" font-size="9" font-weight="800" fill="#5d6c9c">${ang(i)}</text><text x="${h - 5}" y="${Y(i) + 3}" text-anchor="end" font-family="Nunito,sans-serif" font-size="9" font-weight="800" fill="#5d6c9c">${ang(i)}</text>`
  const lines = (o.lines || []).map(l => { const [a, b, c, d] = lineEnds(l.m, l.c, r, s); return `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="${l.col || '#8b5cf6'}" stroke-width="${o.mini ? 4 : 4.5}" stroke-linecap="round" clip-path="url(#${id})"/>` }).join('')
  const live = o.live ? (() => { const [a, b, c, d] = lineEnds(o.live.m, o.live.c, r, s); return `<line id="lv" x1="${a}" y1="${b}" x2="${c}" y2="${d}" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round" clip-path="url(#${id})"/>` })() : ''
  const pts = (o.pts || []).map(p => `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${p.ring ? 8 : 6.5}" fill="${p.ring ? 'none' : (p.col || '#ff5d6c')}" stroke="${p.ring ? '#22c58b' : '#fff'}" stroke-width="${p.ring ? 3 : 2.5}"/>${p.l ? `<text x="${X(p.x) + 9}" y="${Y(p.y) - 8}" font-family="Fredoka,sans-serif" font-weight="600" font-size="13" fill="#1b2a5e" stroke="#fff" stroke-width="3" paint-order="stroke">${p.l}</text>` : ''}`).join('')
  return `<svg class="pl${o.mini ? ' mini' : ''}${o.act ? ' act' : ''}" data-r="${r}" data-s="${s}" viewBox="0 0 ${N} ${N}" role="img" aria-label="${o.label || 'Bidang koordinat'}"><defs><clipPath id="${id}"><rect x="${X(-r) - 4}" y="${Y(r) - 4}" width="${2 * r * s + 8}" height="${2 * r * s + 8}"/></clipPath></defs><rect width="${N}" height="${N}" rx="16" fill="#fff"/>${g}${lines}${live}${pts}<g id="mkg">${o.mk || ''}</g></svg>`
}
const gridPt = (svg, ev) => { const b = svg.getBoundingClientRect(), r = +svg.dataset.r, s = +svg.dataset.s, N = (2 * r + 2) * s, k = N / b.width; return { x: clamp(Math.round(((ev.clientX - b.left) * k - N / 2) / s), -r, r), y: clamp(Math.round((N / 2 - (ev.clientY - b.top) * k) / s), -r, r) } }
const mk = (svg, p, col = '#ff9f1c') => { const r = +svg.dataset.r, s = +svg.dataset.s, h = (2 * r + 2) * s / 2; svg.querySelector('#mkg').innerHTML = `<circle cx="${h + p.x * s}" cy="${h - p.y * s}" r="9" fill="${col}" stroke="#fff" stroke-width="3"/><circle cx="${h + p.x * s}" cy="${h - p.y * s}" r="15" fill="none" stroke="${col}" stroke-opacity=".4" stroke-width="3"/>` }
const setLive = (svg, m, c) => { const r = +svg.dataset.r, s = +svg.dataset.s, e = lineEnds(m, c, r, s), l = svg.querySelector('#lv'); ['x1', 'y1', 'x2', 'y2'].forEach((k, i) => l.setAttribute(k, e[i])) }

const parseNum = s => { s = String(s).replace(/\s/g, '').replace(/−/g, '-'); if (/^-?\d+\/-?\d+$/.test(s)) { const [a, b] = s.split('/').map(Number); return b ? a / b : NaN } return parseFloat(s.replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')) }
const qcard = '<div class="qcard"><div class="qtop"><span class="qtag" id="qTag"></span><span class="sm" id="qTry"></span></div><div class="qfig" id="qFig"></div><div class="qtext" id="qText"></div><div id="qBody"></div><div class="fb" id="qFb" hidden></div><div class="qnext"><button class="btn" id="qNext" type="button" hidden>Lanjut</button></div></div>'
function ask(q, run) {
  return new Promise(resolve => {
    let tries = 0, done = false, locked = false; run.q = q

    run.cancel = () => fin({ ok: false, dead: true })
    const fb = $('#qFb'), nx = $('#qNext'), body = $('#qBody')
    $('#qTag').textContent = q.tag; $('#qFig').innerHTML = q.fig || ''; $('#qText').innerHTML = q.text
    const finish = (ok, msg, dead) => { locked = true; fb.hidden = false; fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.innerHTML = msg; nx.hidden = false; nx.onclick = () => fin({ ok, tries, dead }); nx.focus(); body.querySelectorAll('button,input').forEach(x => x.disabled = true) }
    const wrong = (el, soft) => {
      sfx.no(); react('sad'); S.tot.no++; if (el) el.classList.add('no'); run.onWrong()
      if (run.lives <= 0) return finish(false, `<b>Nyawa habis.</b> ${q.exp}`, true)
      if (tries >= 2) return finish(false, `<b>Belum tepat.</b> ${q.exp}`)
      fb.hidden = false; fb.className = 'fb no'; fb.innerHTML = `<b>Belum tepat.</b> Petunjuk: ${q.hint}`; $('#qTry').textContent = 'Kesempatan terakhir'
      if (el) el.disabled = true

    const verdict = (good, el) => { tries++; if (good) { sfx.ok(); react('cheer'); S.tot.ok++; if (el) el.classList.add('ok'); return finish(true, `<b>Benar!</b> ${q.exp}`) } wrong(el); if (!done && q.type === 'num') { const i = $('#qIn'); i.value = ''; i.focus() } }
    const t = q.type
    if (t === 'mc') {
      body.innerHTML = `<div class="opts ${q.opts.every(x => x.t.length < 14) ? 'two' : ''}">${q.opts.map((x, i) => `<button class="opt" data-i="${i}" type="button">${x.t}</button>`).join('')}</div>`
      $$('#qBody .opt').forEach(b => b.onclick = () => verdict(!!q.opts[+b.dataset.i].ok, b))
    } else if (t === 'num') {
      body.innerHTML = `<form class="inrow" id="qForm"><input id="qIn" inputmode="text" autocomplete="off" aria-label="Jawaban" placeholder="${q.frac ? 'contoh: 3/2 atau −1,5' : 'Jawabanmu'}"><span class="u">${q.unit || ''}</span><button class="btn" type="submit">Cek</button></form>`

    } else if (t === 'plot' || t === 'plot2') {
      body.innerHTML = plane({ ...q.plane, act: true }) + `<div class="rd" id="rd">${t === 'plot' ? 'Ketuk atau seret untuk menaruh titik' : 'Ketuk dua titik pada bidang'}</div><div class="qnext" style="justify-content:center;margin-top:0"><button class="btn mt" id="bChk" type="button" disabled>${t === 'plot' ? 'Pasang titik' : 'Gambar garis'}</button></div>`
      const svg = body.querySelector('svg'), r = +svg.dataset.r, s = +svg.dataset.s, h = (2 * r + 2) * s / 2; let cur = null, drag = false, pts = []
      const draw = () => { let o = ''; if (t === 'plot2' && pts.length === 2 && pts[0].x !== pts[1].x) { const [a, b] = pts, m = (b.y - a.y) / (b.x - a.x), c = a.y - m * a.x, e = lineEnds(m, c, r, s); o += `<line x1="${e[0]}" y1="${e[1]}" x2="${e[2]}" y2="${e[3]}" stroke="#ff9f1c" stroke-width="4" stroke-linecap="round"/>` } for (const p of pts) o += `<circle cx="${h + p.x * s}" cy="${h - p.y * s}" r="8" fill="#ff9f1c" stroke="#fff" stroke-width="3"/>`; svg.querySelector('#mkg').innerHTML = o; $('#rd').textContent = pts.map(p => pairS(p.x, p.y)).join('  ·  ') || '—'; $('#bChk').disabled = t === 'plot' ? !cur : pts.length < 2 }
      svg.addEventListener('pointerdown', e => { if (locked) return; sfx.tap(); const p = gridPt(svg, e); if (t === 'plot') { drag = true; try { svg.setPointerCapture(e.pointerId) } catch (x) {} cur = p; pts = [p] } else { if (pts.length >= 2) pts = []; pts.push(p) } draw() })
      svg.addEventListener('pointermove', e => { if (drag && !locked) { const p = gridPt(svg, e); cur = p; pts = [p]; draw() } })
      const up = () => drag = false; svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up)
      $('#bChk').onclick = () => { if (locked) return; if (t === 'plot') verdict(cur.x === q.t.x && cur.y === q.t.y); else { const [a, b] = pts, ok = (a.x !== b.x || a.y !== b.y) && [a, b].every(p => Math.abs(p.y - (q.line.m * p.x + q.line.c)) < 1e-9); verdict(ok) } }
    } else if (t === 'slide') {
      const st = { m: 0, c: q.c0 || 0 }; q.sl.forEach(x => st[x.k] = x.v)
      body.innerHTML = plane({ r: q.r, s: Math.floor(330 / (2 * q.r + 2)), pts: q.pts, live: { m: st.m, c: st.c } }) + `<div class="rd" id="rd">${eqD(st.m, st.c)}</div>` + q.sl.map(x => `<div class="sl"><label for="s_${x.k}">${x.lab}</label><input type="range" id="s_${x.k}" min="${x.min}" max="${x.max}" step="${x.step}" value="${x.v}"><output id="o_${x.k}">${dec(x.v)}</output></div>`).join('') + '<div class="qnext" style="justify-content:center"><button class="btn mt" id="bChk" type="button">Periksa</button></div>'
      const svg = body.querySelector('svg')
      q.sl.forEach(x => $('#s_' + x.k).oninput = e => { if (locked) return; st[x.k] = +e.target.value; $('#o_' + x.k).textContent = dec(st[x.k]); setLive(svg, st.m, st.c); $('#rd').textContent = eqD(st.m, st.c); sfx.tap() })
      $('#bChk').onclick = () => { if (locked) return; verdict(Math.abs(st.m - q.t.m) < 1e-9 && Math.abs(st.c - q.t.c) < 1e-9) }
    } else if (t === 'match') {
      const n = q.left.length; let sel = null, got = 0, mist = 0
      body.innerHTML = `<div class="mt2">${q.left.map((h, i) => `<button class="mi" data-l="${i}" type="button" aria-label="Grafik ${i + 1}">${h}</button><button class="mi" data-r="${i}" type="button">${q.right[i]}</button>`).join('')}</div>`
      const L = i => body.querySelector(`[data-l="${i}"]`), Rr = i => body.querySelector(`[data-r="${i}"]`)
      body.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { if (locked || b.classList.contains('done')) return; sfx.tap(); body.querySelectorAll('[data-l]').forEach(x => x.classList.remove('sel')); sel = +b.dataset.l; b.classList.add('sel') })
      body.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { if (locked || sel === null || b.classList.contains('done')) return; const j = +b.dataset.r
        if (q.pair[sel] === j) { sfx.ok(); L(sel).classList.remove('sel'); L(sel).classList.add('done'); b.classList.add('done'); sel = null; if (++got === n) { tries = mist ? 2 : 1; S.tot.ok++; react('cheer'); finish(true, `<b>Semua cocok!</b> ${q.exp}`) } }
        else { mist++; tries = 2; [L(sel), b].forEach(x => { x.classList.add('shk'); setTimeout(() => x.classList.remove('shk'), 320) }); L(sel).classList.remove('sel'); sel = null; sfx.no(); react('sad'); S.tot.no++; run.onWrong(); if (run.lives <= 0) return finish(false, `<b>Nyawa habis.</b> ${q.exp}`, true); fb.hidden = false; fb.className = 'fb no'; fb.innerHTML = `<b>Belum cocok.</b> Petunjuk: ${q.hint}` } })
    } else if (t === 'tiles') {
      const st = q.expect.map(() => -1); let si = 0
      const parts = q.parts.map(p => p === '#' ? `<span class="slot" data-s="${si++}" role="button" tabindex="0" aria-label="Slot kosong"></span>` : `<span>${p}</span>`).join('')
      body.innerHTML = `<div class="eqrow" id="eqr">${parts}</div><div class="bank" id="bnk"></div><div class="rd">Seret atau ketuk kartu ke kotak yang kosong. Ketuk kotak untuk mengosongkan.</div><div class="qnext" style="justify-content:center;margin-top:0"><button class="btn mt" id="bChk" type="button">Periksa</button></div>`
      const draw = () => { body.querySelectorAll('.slot').forEach((el, i) => { el.textContent = st[i] < 0 ? '' : q.bank[st[i]]; el.setAttribute('aria-label', st[i] < 0 ? 'Slot kosong' : 'Slot berisi ' + q.bank[st[i]]) }); $('#bnk').innerHTML = q.bank.map((b, i) => st.includes(i) ? '' : `<button class="tl" data-i="${i}" type="button">${b}</button>`).join(''); bindBank() }
      const place = (ti, s) => { if (s < 0) return; st[s] = ti; sfx.tap(); draw() }
      const bindBank = () => body.querySelectorAll('.tl').forEach(b => b.onpointerdown = e => { if (locked) return; e.preventDefault(); const ti = +b.dataset.i, sx = e.clientX, sy = e.clientY; let gh = null

let R = null
const stale = r => r !== R || r.over
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
const say = (mood, html, st = '') => `<div class="say" ${st ? `style="${st}"` : ''}><div class="av" id="av">${headSVG(mood)}</div><div class="bub">${html}</div></div>`
function hud() {
  const r = R, L = r.L
  $('#hud').innerHTML = `<button class="btn ghost sm" id="bBack" type="button">← Peta</button><div class="nm">Area ${L.n}: ${L.t}<small>${r.correct}/${L.need} selesai</small></div><span class="it" aria-label="Nyawa">${ic('heart').repeat(Math.max(r.lives, 0)) || '<small>0</small>'}</span><span class="it">${ic('coin')}${r.crystals}</span><span class="it">★ ${r.score}</span>${L.time ? `<span class="it tm${r.left <= 30 ? ' low' : ''}">${ic('clock')}${fmt(Math.max(r.left, 0))}</span>` : ''}`
  $('#bBack').onclick = () => { if (confirm('Keluar dari area? Progres area ini tidak disimpan.')) leave() }
}
const track = r => `<div class="track" aria-hidden="true">${Array.from({ length: r.L.need }, (_, i) => `${i ? `<span class="ln${i <= r.correct ? ' on' : ''}"></span>` : ''}<span class="nd${i < r.correct ? ' on' : i === r.correct ? ' cur' : ''}">${i < r.correct ? '✓' : i + 1}</span>`).join('')}</div>`
function leave() { if (R) { R.over = true; R.cancel && R.cancel(); R = null } go('sMap') }
function frame(r, inner, mood = 'think') { $('#stage').innerHTML = `${scene(r.L.n, r.correct, r.L.need, mood)}${track(r)}${inner}` }
function startArea(n) {
  if (R) { R.over = true; R.cancel && R.cancel() }
  const L = AREAS[n], run = R = { L, n, lives: L.lives, score: 0, crystals: 0, mistakes: 0, correct: 0, left: L.time, over: false, cancel: null, onWrong: () => { run.lives--; run.mistakes++; hud() } }
  $('#sPlay').innerHTML = '<div class="hud glass" id="hud"></div><div class="stage" id="stage"></div>'; showOnly('sPlay'); hud()
  frame(run, `<div class="brief">${say('smile', `<b>Area ${n}: ${L.t}</b><br>${L.say}`, 'padding:0 0 10px')}<div class="goals"><div><b>${L.need}</b><span>tantangan</span></div><div><b>${L.lives}</b><span>nyawa</span></div><div><b>${L.time ? fmt(L.time) : '∞'}</b><span>waktu</span></div></div><p class="sm">${L.obj}</p><p class="sm" style="margin-top:6px">Mekanisme: ${L.mech}</p><div style="display:flex;justify-content:center;padding:14px 0 6px"><button class="btn big" id="bGo" type="button">Mulai membangun</button></div></div>`, 'smile')
  $('#bGo').onclick = () => playArea(run)
}
async function playArea(run) {
  const L = run.L
  if (L.time) { const iv = setInterval(() => { if (stale(run)) return clearInterval(iv); run.left--; hud(); if (run.left <= 0) { clearInterval(iv); run.over = true; run.cancel && run.cancel(); lose(run, 'Waktu habis!') } }, 1000) }
  while (run.correct < L.need && !stale(run)) {
    frame(run, `${say('think', `Tantangan ${run.correct + 1} dari ${L.need}.`)}${qcard}`)
    const q = L.gens[run.correct](); await ask(q, run).then(res => {
      if (stale(run)) return
      if (res.ok) { run.correct++; run.score += res.tries === 1 ? L.pts : L.pts / 2; if (res.tries === 1) run.crystals++ }
      hud(); if (res.dead) { run.over = true; lose(run, 'Nyawa habis!') }
    })
    if (stale(run)) return
  }
  if (!stale(run)) win(run)
}
function lose(run, why) {
  if (run !== R) return; run.over = true; save()
  $('#sRes').innerHTML = `<div class="res glass"><div class="rch">${guideSVG('sad')}</div><h2>${why}</h2><p class="sm">Pembangunan area ${run.n} belum selesai. Coba lagi; soalnya akan berbeda.</p><div class="acts"><button class="btn" id="rAgain" type="button">Ulangi area</button><button class="btn ghost" id="rMap" type="button">Kembali ke peta</button></div></div>`
  showOnly('sRes'); $('#rAgain').onclick = () => startArea(run.n); $('#rMap').onclick = leave
}
function win(run) {
  run.over = true; const L = run.L, n = run.n
  const bl = run.lives * 50, bt = L.time ? Math.round(run.left * 2) : 0, base = run.score
  run.crystals += 3; run.score = base + bl + bt
  const st = run.mistakes === 0 ? 3 : run.mistakes <= 2 ? 2 : 1, rec = { score: run.score, crystals: run.crystals, stars: st, mistakes: run.mistakes }, prev = S.best[n]
  if (!prev || rec.score > prev.score) S.best[n] = { ...rec, stars: Math.max(st, prev ? prev.stars : 0) }
  S.unlocked = Math.max(S.unlocked, Math.min(n + 1, 5)); save(); sfx.win()
  ping({ type: 'level', level: n, score: rec.score, crystals: rec.crystals, stars: st, mistakes: rec.mistakes })
  $('#sRes').innerHTML = `<div class="res glass"><div class="rch">${guideSVG('cheer')}</div><span class="tag">Area ${n} selesai</span><h2>${L.t}</h2><svg viewBox="-135 -130 270 280" style="width:min(240px,70%);display:block;margin:0 auto" aria-hidden="true">${zoneArt(n, 2)}</svg><div class="stars" aria-label="${st} dari 3 bintang">${'★'.repeat(st)}<span class="o">${'★'.repeat(3 - st)}</span></div>
  <div class="rows"><div><span>Skor soal</span><span>${base}</span></div><div><span>Bonus nyawa</span><span>+${bl}</span></div>${L.time ? `<div><span>Bonus waktu</span><span>+${bt}</span></div>` : ''}<div><span>Koin</span><span>${run.crystals}</span></div><div class="t"><span>Total skor</span><span>${run.score}</span></div></div>
  <div class="acts">${n < 5 ? `<button class="btn" id="rNext" type="button">Area berikutnya</button>` : `<button class="btn" id="rFin" type="button">Lihat kotamu</button>`}<button class="btn ghost" id="rAgain" type="button">Main lagi</button><button class="btn ghost" id="rMap" type="button">City Map</button></div></div>`
  showOnly('sRes'); R = null
  if ($('#rNext')) $('#rNext').onclick = () => startArea(n + 1); if ($('#rFin')) $('#rFin').onclick = final
  $('#rAgain').onclick = () => startArea(n); $('#rMap').onclick = () => go('sMap')
}
function final() {
  const T = totals(), rank = T.score >= 4000 ? 'Walikota Line City' : T.score >= 3000 ? 'Perancang Kota Handal' : 'Arsitek Kota'
  $('#sRes').innerHTML = `<div class="res glass"><div class="rch">${guideSVG('cheer')}</div><span class="tag">Line City selesai</span><h2>${rank}</h2><p class="sm">Seluruh kota berdiri berkat Persamaan Garis Lurus.</p><div class="mapbox" style="margin:12px 0">${cityMap()}</div><div class="stars">${'★'.repeat(Math.round(T.st / 5))}<span class="o">${'★'.repeat(3 - Math.round(T.st / 5))}</span></div><div class="rows"><div><span>Total skor</span><span>${T.score}</span></div><div><span>Bintang</span><span>${T.st}/15</span></div></div><div class="acts"><button class="btn" id="rMap" type="button">Kembali ke peta</button><button class="btn ghost" id="rAch" type="button">Lihat penghargaan</button></div></div>`

/* ---------- halaman ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const PAGES = [['sLand', 'Beranda'], ['sDash', 'Dashboard'], ['sMap', 'City Map'], ['sMini', 'Mini Games'], ['sAch', 'Achievement'], ['sProg', 'My Progress']]
const ALL = ['sLand', 'sProf', 'sDash', 'sMap', 'sPlay', 'sMini', 'sAch', 'sProg', 'sRes']
$('#nav').innerHTML = PAGES.map(([id, t]) => `<button type="button" data-go="${id}">${t}</button>`).join('')
function showOnly(id) { clearInterval(window._mt); ALL.forEach(x => $('#' + x).hidden = x !== id); $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === id)); scrollTo(0, 0) }
const RENDER = {}
function go(id) { if (!S.name && id !== 'sLand' && id !== 'sProf') id = 'sProf'; if (R && id !== 'sPlay') { R.over = true; R.cancel && R.cancel(); R = null } RENDER[id] && RENDER[id](); showOnly(id) }
$('#nav').onclick = e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go) }
$('#bHome').onclick = () => go('sLand')
const stars = k => '★'.repeat(k) + '☆'.repeat(3 - k)

RENDER.sLand = () => {
  $('#sLand').innerHTML = `<div class="land"><div><span class="tag">City Builder · Simulasi · Puzzle</span><h1>LINE <span>CITY</span></h1><div class="sub">Build Your Math World!</div>
  <p>Jadilah City Designer! Selesaikan tantangan Persamaan Garis Lurus bersama Lina untuk membangun taman, bukit, menara, akademi, dan gedung pencakar langit di kotamu.</p>
  <button class="btn big" id="bStart" type="button">${S.name ? 'Lanjutkan membangun' : 'Mulai membangun'}</button>
  <details class="how"><summary>Cara bermain</summary><ul><li>Buka City Map dan pilih area yang tersedia. Area baru terbuka setelah area sebelumnya selesai.</li><li>Tiap area punya tantangan dan cara main yang berbeda: seret titik, atur slider, cocokkan, susun persamaan, dan gambar grafik.</li><li>Jawaban salah mengurangi nyawa dan memberi petunjuk. Ada satu kesempatan ulang.</li><li>Kumpulkan XP, koin, bintang, dan lencana.</li></ul></details></div>
  <div class="hero" style="aspect-ratio:1000/640">${cityMap(1)}<div class="ch">${guideSVG('cheer')}</div></div></div>`
  $('#bStart').onclick = () => go(S.name ? 'sDash' : 'sProf')
}
RENDER.sProf = () => {
  let av = S.av
  $('#sProf').innerHTML = `<div class="prof glass"><span class="tag">Player Profile</span><h2>Siapa nama City Designer?</h2><p class="sm">Pilih avatar dan tulis namamu. Data ini hanya tersimpan di perangkat ini.</p><label class="field" for="pName">Nama pemain</label><input class="inp" id="pName" maxlength="14" autocomplete="off" value="${esc(S.name)}" placeholder="contoh: Raka"><span class="field" style="display:block">Pilih avatar</span><div class="avs" id="avs">${[0, 1, 2, 3, 4, 5].map(i => `<button type="button" data-a="${i}" class="${i === av ? 'on' : ''}" aria-label="Avatar ${i + 1}"><span class="av">${avatarSVG(i)}</span></button>`).join('')}</div><button class="btn big" id="pOk" type="button">Masuk ke kota</button></div>`
  $('#avs').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; av = +b.dataset.a; $$('#avs button').forEach(x => x.classList.toggle('on', x === b)) }
  $('#pOk').onclick = () => { const n = $('#pName').value.trim(); if (!n) { $('#pName').focus(); $('#pName').style.boxShadow = 'inset 0 0 0 3px #ff4d6d'; return } S.name = n; S.av = av; save(); go('sDash') }
}
RENDER.sDash = () => {
  const T = totals(), xp = xpOf(), lv = lvlOf(), into = xp % LV_XP, cur = [1, 2, 3, 4, 5].find(n => !S.best[n]) || 0
  $('#sDash').innerHTML = `<div class="pg"><div class="dh glass"><div class="av">${avatarSVG(S.av)}</div><div style="flex:1;min-width:180px"><h2>Halo, ${esc(S.name)}!</h2><div class="sm">${rankOf()} · Level ${lv}</div></div><button class="btn mt sm" id="dEdit" type="button">Ubah profil</button></div>
  <div class="stats"><div class="stat glass"><div class="ic">${ic('xp')}</div><span class="sm">XP</span><b>${xp}</b><div class="bar pu" style="margin-top:6px"><i style="width:${into / LV_XP * 100}%"></i></div><span class="sm">${LV_XP - into} XP lagi ke level ${lv + 1}</span></div>
  <div class="stat glass"><div class="ic">${ic('coin')}</div><span class="sm">Koin</span><b>${coinsOf()}</b></div><div class="stat glass"><div class="ic">${ic('star')}</div><span class="sm">Bintang</span><b>${T.st}/15</b></div><div class="stat glass"><div class="ic">${ic('map')}</div><span class="sm">Area selesai</span><b>${T.done}/5</b></div></div>
  <div class="glass pad"><b style="font:600 18px var(--head)">Progres kota</b><div class="bar" style="margin:8px 0"><i style="width:${T.done * 20}%"></i></div><div class="sm">${T.done === 5 ? 'Kota selesai dibangun! Ulangi area untuk menambah bintang.' : `Berikutnya: Area ${cur} — ${NAMA[cur]}`}</div><div style="margin-top:10px"><button class="btn" id="dNext" type="button">${T.done === 5 ? 'Lihat City Map' : T.done === 0 ? 'Mulai Area 1' : 'Lanjut ke Area ' + cur}</button></div></div>
  <div class="tiles"><button class="tile2" data-go="sMap" type="button"><span class="ic">${ic('map')}</span><b>City Map</b><span>Pusat permainan</span></button><button class="tile2" data-go="sMini" type="button"><span class="ic">${ic('game')}</span><b>Mini Games</b><span>Cari koin tambahan</span></button><button class="tile2" data-go="sAch" type="button"><span class="ic">${ic('trophy')}</span><b>Achievement</b><span>Koleksi penghargaan</span></button></div></div>`
  $('#dEdit').onclick = () => go('sProf'); $('#dNext').onclick = () => T.done === 5 ? go('sMap') : startArea(cur)
  $$('#sDash .tile2').forEach(b => b.onclick = () => go(b.dataset.go))
}
RENDER.sMap = () => {
  const T = totals(), cur = [1, 2, 3, 4, 5].find(n => !S.best[n]) || 0
  $('#sMap').innerHTML = `<div class="pg"><h2>City Map</h2><p class="sm">Ketuk area untuk mulai membangun. Area yang masih berpagar konstruksi terbuka setelah area sebelumnya selesai.</p><div class="chips" style="margin-bottom:12px"><span class="chip">XP ${xpOf()}</span><span class="chip">Koin ${coinsOf()}</span><span class="chip">Bintang ${T.st}/15</span><span class="chip">Level ${lvlOf()}</span></div><div class="mapbox">${cityMap()}</div><p class="sm" id="mnote" aria-live="polite" style="margin-top:8px"></p>
  <div class="alist">${[1, 2, 3, 4, 5].map(n => { const lock = n > S.unlocked, b = S.best[n]; return `<button class="ac${lock ? ' lock' : ''}${n === cur ? ' cur' : ''}" data-n="${n}" type="button"><div class="n">AREA ${n}${lock ? ' · TERKUNCI' : ''}</div><h3>${NAMA[n]}</h3><div class="s">${AREAS[n].d}</div><div class="s" style="margin-top:4px;color:#b27a00">${b ? stars(b.stars) + ' · ' + b.score : lock ? 'Selesaikan area sebelumnya' : 'Belum dibangun'}</div></button>` }).join('')}</div></div>`
  const open = n => { if (n > S.unlocked) { $('#mnote').textContent = `Area ${n} masih terkunci. Selesaikan Area ${n - 1} lebih dulu.`; sfx.no(); return } startArea(n) }
  $$('#sMap .ac').forEach(b => b.onclick = () => open(+b.dataset.n))
  $$('#sMap .zone').forEach(z => { z.onclick = () => open(+z.dataset.n); z.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(+z.dataset.n) } } })
}
RENDER.sAch = () => {
  const T = totals(), got = BADGES.map(b => ({ ...b, on: b.ok(S, T) }))
  $('#sAch').innerHTML = `<div class="pg"><h2>Achievement</h2><p class="sm">${got.filter(b => b.on).length} dari ${got.length} penghargaan terkumpul.</p><div class="badges">${got.map(b => `<div class="bdg${b.on ? '' : ' off'}"><div class="ic">${b.i}</div><b>${b.n}</b><span>${b.d}</span></div>`).join('')}</div></div>`
}
RENDER.sProg = () => {
  const T = totals(), tot = S.tot.ok + S.tot.no, acc = tot ? Math.round(S.tot.ok / tot * 100) : 0
  const worst = [1, 2, 3, 4, 5].filter(n => S.best[n]).sort((a, b) => S.best[b].mistakes - S.best[a].mistakes)[0]
  $('#sProg').innerHTML = `<div class="pg"><h2>My Progress</h2><p class="sm">Hasil dan perkembangan belajarmu.</p><div class="stats"><div class="stat glass"><span class="sm">Jawaban benar</span><b>${S.tot.ok}</b></div><div class="stat glass"><span class="sm">Jawaban salah</span><b>${S.tot.no}</b></div><div class="stat glass"><span class="sm">Ketepatan</span><b>${acc}%</b></div><div class="stat glass"><span class="sm">Total skor</span><b>${T.score}</b></div></div>
  <div class="glass pad">${[1, 2, 3, 4, 5].map(n => { const b = S.best[n]; return `<div class="prow"><b>${n}. ${NAMA[n]}</b><div class="bar"><i style="width:${b ? 100 : n <= S.unlocked ? 8 : 0}%"></i></div><span class="sm">${b ? stars(b.stars) + ' · ' + b.score : n <= S.unlocked ? 'Belum selesai' : 'Terkunci'}</span></div>` }).join('')}</div>
  <div class="glass pad" style="margin-top:14px"><b style="font:600 18px var(--head)">Rekomendasi belajar</b><p style="margin:6px 0;line-height:1.5">${!T.done ? 'Mulai dengan membangun Coordinate Park di City Map.' : worst && S.best[worst].mistakes > 0 ? `Area yang paling banyak salah: <b>${NAMA[worst]}</b> (${S.best[worst].mistakes} salah). Ulangi area itu untuk menambah bintang.` : 'Kamu bermain tanpa banyak salah. Coba ulangi area untuk mendapat 3 bintang dan skor lebih tinggi.'}</p><div class="acts" style="justify-content:flex-start"><button class="btn bl sm" data-go="sMap" type="button">Buka City Map</button><button class="btn ghost sm" id="pgReset" type="button">Hapus semua progres</button></div></div></div>`
  $('#sProg').querySelector('[data-go]').onclick = () => go('sMap')
  $('#pgReset').onclick = () => { if (confirm('Hapus semua progres game LINE CITY di perangkat ini? (Hasil yang sudah tersimpan di akun tidak dihapus.)')) { S = S0(); save(); go('sLand') } }
}

/* ---------- Mini Games ---------- */
function endMini(key, name, sc) {
  clearInterval(window._mt); const best = Math.max(S.mini[key] || 0, sc); S.mini[key] = best; S.coins2 += sc; S.mxp += sc * 3; save(); sfx.win()
  $('#sMini').innerHTML = `<div class="pg"><div class="res glass"><div class="rch">${guideSVG(sc >= 8 ? 'cheer' : 'smile')}</div><h2>${name}</h2><div class="stars" style="font-size:54px;letter-spacing:0">${sc}</div><p class="sm">Skor kamu. Rekor: ${best}</p><div class="rows"><div><span>Koin didapat</span><span>+${sc}</span></div><div><span>XP didapat</span><span>+${sc * 3}</span></div></div><div class="acts"><button class="btn" id="mAgain" type="button">Main lagi</button><button class="btn ghost" id="mBack" type="button">Daftar mini game</button></div></div></div>`
  $('#mAgain').onclick = () => key === 'm1' ? mini1() : mini2(); $('#mBack').onclick = () => go('sMini')
}
function mini1() {
  let sc = 0, t = 30, tg; const rt = () => { tg = { x: rnd(-5, 5), y: rnd(-5, 5) }; $('#mTg').textContent = `Ketuk titik ${pairS(tg.x, tg.y)}` }
  $('#sMini').innerHTML = `<div class="pg"><div class="mini-top glass pad"><b>Koordinat Kilat</b><span class="chip" id="mS">Skor 0</span><span class="chip" id="mT">30 dtk</span></div><div class="glass pad"><div class="rd" id="mTg" aria-live="polite"></div>${plane({ r: 5, s: 26, act: true })}</div></div>`
  const svg = $('#sMini .pl'); rt()
  svg.addEventListener('pointerdown', e => { const p = gridPt(svg, e); if (p.x === tg.x && p.y === tg.y) { sc++; sfx.ok(); $('#mS').textContent = 'Skor ' + sc; rt() } else { sfx.no(); t = Math.max(0, t - 1) } mk(svg, p, p.x === tg.x && p.y === tg.y ? '#22c58b' : '#ff4d6d') })
  window._mt = setInterval(() => { t--; $('#mT').textContent = Math.max(t, 0) + ' dtk'; if (t <= 0) endMini('m1', 'Koordinat Kilat', sc) }, 1000)
}
function mini2() {
  let sc = 0, t = 30, cor
  const POOL = [[-3, 1], [-2, 1], [-1, 1], [-1, 2], [1, 2], [1, 1], [2, 1], [3, 1]], rt = () => { const ch = shuffle(POOL).slice(0, 4); cor = pick(ch); const c = pick([-1, 0, 1, 2]); $('#mQ').innerHTML = plane({ r: 4, s: 30, lines: [{ m: cor[0] / cor[1], c }], label: 'Garis' }).replace('class="pl', 'style="max-width:220px" class="pl'); $('#mO').innerHTML = ch.map(([n, d]) => `<button class="opt" data-n="${n}" data-d="${d}" type="button">${fr(n, d)}</button>`).join(''); $$('#mO .opt').forEach(b => b.onclick = () => { if (+b.dataset.n === cor[0] && +b.dataset.d === cor[1]) { sc++; sfx.ok(); $('#mS').textContent = 'Skor ' + sc } else { sfx.no(); t = Math.max(0, t - 1) } rt() }) }
  $('#sMini').innerHTML = `<div class="pg"><div class="mini-top glass pad"><b>Tebak Gradien</b><span class="chip" id="mS">Skor 0</span><span class="chip" id="mT">30 dtk</span></div><div class="glass pad"><div class="rd">Berapa gradien garis ini?</div><div id="mQ"></div><div class="opts two" id="mO" style="margin-top:10px"></div></div></div>`
  rt(); window._mt = setInterval(() => { t--; $('#mT').textContent = Math.max(t, 0) + ' dtk'; if (t <= 0) endMini('m2', 'Tebak Gradien', sc) }, 1000)
}
RENDER.sMini = () => {
  $('#sMini').innerHTML = `<div class="pg"><h2>Mini Games</h2><p class="sm">Permainan singkat 30 detik untuk mengumpulkan koin dan XP tambahan.</p><div class="mgrid"><div class="mg glass"><div class="av" style="border-radius:16px;width:56px;height:56px">${`<svg viewBox="0 0 64 64">${ico.map}</svg>`}</div><h3>Koordinat Kilat</h3><p class="sm" style="margin:4px 0 10px">Ketuk titik koordinat yang diminta secepat mungkin. Rekor: ${S.mini.m1 || 0}</p><button class="btn mt" id="m1" type="button">Main</button></div><div class="mg glass"><div class="av" style="border-radius:16px;width:56px;height:56px">${`<svg viewBox="0 0 64 64">${ico.line}</svg>`.replace('stroke="#fff"', 'stroke="#8b5cf6"')}</div><h3>Tebak Gradien</h3><p class="sm" style="margin:4px 0 10px">Lihat garis, pilih gradiennya sebanyak mungkin. Rekor: ${S.mini.m2 || 0}</p><button class="btn mt" id="m2" type="button">Main</button></div></div></div>`
  $('#m1').onclick = mini1; $('#m2').onclick = mini2
}

/* ---------- init ---------- */
$('#sky').innerHTML = `<svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"><circle cx="880" cy="110" r="60" fill="#fff3a6" opacity=".9"/><circle cx="880" cy="110" r="44" fill="url(#gYel)"/>${[[80, 90, 1], [560, 70, .8], [300, 540, 1.1], [760, 500, .9]].map(([x, y, s]) => `<g transform="translate(${x} ${y}) scale(${s})" opacity=".9"><ellipse cx="0" cy="12" rx="64" ry="20" fill="#fff"/><circle cx="-18" cy="0" r="22" fill="#fff"/><circle cx="14" cy="-8" r="28" fill="#fff"/></g>`).join('')}</svg>`
$('#bSound').onclick = e => { sound = !sound; e.target.textContent = 'Suara: ' + (sound ? 'nyala' : 'mati'); e.target.setAttribute('aria-pressed', sound) }
addEventListener('message', e => { const d = e.data; if (e.source !== parent || !d || d.mq !== 'linecity' || d.type !== 'restore' || !Array.isArray(d.best)) return
  d.best.forEach(b => { const n = +b.level; if (n < 1 || n > 5) return; const p = S.best[n], r = { score: +(b.skor ?? b.score) || 0, crystals: +(b.kristal ?? b.crystals) || 0, stars: Math.min(3, +(b.bintang ?? b.stars) || 1), mistakes: +(b.salah ?? b.mistakes) || 0 }; if (!p || r.score > p.score) S.best[n] = r; S.unlocked = Math.max(S.unlocked, Math.min(n + 1, 5)) })
  save(); const vis = ALL.find(x => !$('#' + x).hidden); if (vis && RENDER[vis]) RENDER[vis]() })
go('sLand')
ping({ type: 'ready' })
})()
</script>

</html>
