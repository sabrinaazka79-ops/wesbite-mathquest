  <!-- Tumpukan buku + kompas (kanan bawah) -->
  <g transform="translate(1290,610)">
    <rect x="30" y="170" width="230" height="52" rx="10" fill="#5b45d6"/>
    <rect x="42" y="176" width="206" height="12" rx="6" fill="#8c78f2" opacity="0.6"/>
    <rect x="50" y="118" width="210" height="52" rx="10" fill="#7d6be0"/>
    <text x="155" y="154" font-family="Arial Black, Arial, sans-serif" font-size="30" font-weight="900" fill="#fff" text-anchor="middle">MATH</text>
    <path d="M60 118 L130 52 L240 70 L260 118 Z" fill="#fff7e6" stroke="#e0d2b0" stroke-width="3"/>
    <path d="M80 110 L138 66 L228 82" fill="none" stroke="#c9bfe8" stroke-width="4" stroke-dasharray="4 6"/>
    <g stroke="#5a8fc9" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="10" y1="150" x2="48" y2="56"/>
      <line x1="48" y1="56" x2="84" y2="150"/>
    </g>
    <circle cx="48" cy="52" r="10" fill="#7bb1e8"/>
  </g>

  <!-- Kutipan -->
  <g transform="translate(1390,170) rotate(-12)" font-family="'Comic Sans MS','Segoe Print','Bradley Hand',cursive" font-size="30" font-weight="700" fill="#6c4df0" text-anchor="middle">
    <text x="0" y="0">Setiap</text>
    <text x="0" y="38">langkah kecil</text>
    <text x="0" y="76">adalah kemajuan</text>
    <text x="0" y="114">besar!</text>
  </g>

  <!-- Gelombang bawah -->
  <path d="M0 830 Q220 760 480 820 Q700 870 900 900 L0 900 Z" fill="url(#wave)" opacity="0.9"/>
  <path d="M1000 900 Q1250 840 1600 870 L1600 900 Z" fill="#8f7bf5" opacity="0.5"/>
</svg>
