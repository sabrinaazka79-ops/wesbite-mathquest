    <g transform="translate(540,240) rotate(14)" fill="#ffc533">
      <rect x="-14" y="-52" width="28" height="104" rx="14" transform="rotate(45)"/>
      <rect x="-14" y="-52" width="28" height="104" rx="14" transform="rotate(-45)"/>
    </g>
    <g transform="translate(618,340)" fill="#59b8ee">
      <rect x="-26" y="-6" width="52" height="12" rx="6"/>
      <circle cx="0" cy="-26" r="9"/><circle cx="0" cy="26" r="9"/>
