    <polyline points="182,436 214,452 238,428 270,444" fill="none" stroke="#e46a5a" stroke-width="4" stroke-dasharray="6 6"/>
    <!-- tangan -->
    <circle cx="146" cy="470" r="18" fill="#f2c7a3"/>
    <circle cx="300" cy="448" r="18" fill="#f2c7a3"/>
    <!-- kepala -->
    <circle cx="190" cy="250" r="78" fill="#f7d3b2"/>
    <path d="M112 244 Q120 168 190 164 Q262 168 270 244 Q240 204 190 206 Q140 204 112 244 Z" fill="#2b1d2b"/>
    <circle cx="160" cy="262" r="12" fill="#5a3320"/><circle cx="220" cy="262" r="12" fill="#5a3320"/>
    <circle cx="164" cy="258" r="4" fill="#fff"/><circle cx="224" cy="258" r="4" fill="#fff"/>
    <circle cx="140" cy="290" r="10" fill="#f5a4a0" opacity="0.6"/><circle cx="240" cy="290" r="10" fill="#f5a4a0" opacity="0.6"/>
    <path d="M168 292 Q190 316 214 292 Q190 300 168 292 Z" fill="#c4473f"/>
    <!-- topi -->
    <ellipse cx="190" cy="184" rx="128" ry="30" fill="#e0b97a"/>
    <path d="M118 184 Q120 100 190 98 Q262 100 264 184 Z" fill="#edc88a"/>
    <path d="M118 176 Q190 198 264 176 L264 190 Q190 214 118 190 Z" fill="#7d6be0"/>
