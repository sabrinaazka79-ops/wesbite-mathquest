    <g transform="translate(470,560) scale(0.7)"><rect x="-6" y="70" width="12" height="60" fill="#8a5a3c"/><circle cx="0" cy="40" r="46" fill="#3fa86f"/><circle cx="-26" cy="70" r="30" fill="#4fb97c"/></g>
    <g transform="translate(1100,580) scale(0.8)"><rect x="-6" y="70" width="12" height="60" fill="#8a5a3c"/><circle cx="0" cy="40" r="46" fill="#3fa86f"/><circle cx="26" cy="68" r="30" fill="#4fb97c"/></g>
    <g transform="translate(1520,470)"><rect x="-6" y="80" width="12" height="70" fill="#8a5a3c"/><circle cx="0" cy="40" r="54" fill="#3fa86f"/><circle cx="-32" cy="76" r="34" fill="#4fb97c"/><circle cx="32" cy="76" r="34" fill="#4fb97c"/></g>
    <g transform="translate(1390,560) scale(0.7)"><rect x="-6" y="70" width="12" height="60" fill="#8a5a3c"/><circle cx="0" cy="40" r="46" fill="#3fa86f"/><circle cx="-26" cy="70" r="30" fill="#4fb97c"/></g>
  </g>

