    <polygon points="35,-30 56,-23 35,-16" fill="#ff6b7a"/>
    <rect x="28" y="60" width="14" height="30" rx="7" fill="#7d6be0"/>
  </g>
  <!-- Air terjun -->
  <path d="M700 590 Q712 640 706 700 L734 700 Q738 640 724 590 Z" fill="#bfe6ff" opacity="0.85"/>

