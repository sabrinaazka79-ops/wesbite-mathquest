    <g transform="translate(560,70)"><ellipse cx="80" cy="50" rx="100" ry="30"/><ellipse cx="120" cy="32" rx="55" ry="30"/></g>
    <g transform="translate(1180,300)"><ellipse cx="80" cy="50" rx="110" ry="34"/><ellipse cx="130" cy="28" rx="60" ry="34"/><ellipse cx="40" cy="40" rx="45" ry="26"/></g>
    <g transform="translate(900,120)" opacity="0.8"><ellipse cx="60" cy="40" rx="80" ry="24"/><ellipse cx="90" cy="26" rx="40" ry="24"/></g>
  </g>

  <!-- Gunung belakang kiri -->
  <path d="M-40 640 L120 400 L210 500 L330 330 L520 640 Z" fill="url(#mtnL)"/>
  <path d="M330 330 L290 395 L322 380 L345 410 L372 372 Z" fill="#fff" opacity="0.9"/>
  <path d="M120 400 L92 445 L118 435 L140 455 Z" fill="#fff" opacity="0.85"/>

  <!-- Gunung belakang kanan -->
  <path d="M1000 660 L1210 420 L1300 500 L1430 360 L1640 660 Z" fill="url(#mtnL)"/>
  <path d="M1430 360 L1392 430 L1424 414 L1448 446 L1474 408 Z" fill="#fff" opacity="0.9"/>
  <path d="M1210 420 L1180 468 L1208 456 L1232 478 Z" fill="#fff" opacity="0.85"/>

  <!-- Bukit dengan istana -->
  <path d="M380 700 Q560 520 760 560 Q900 590 960 700 Z" fill="url(#hill1)"/>
  <g transform="translate(600,478)">
    <rect x="0" y="30" width="70" height="60" fill="#c9bfe8"/>
    <rect x="-18" y="46" width="30" height="44" fill="#d8cff0"/>
    <rect x="58" y="46" width="30" height="44" fill="#d8cff0"/>
    <polygon points="-22,46 -3,16 16,46" fill="#7d6be0"/>
    <polygon points="54,46 73,16 92,46" fill="#7d6be0"/>
    <polygon points="8,30 35,-6 62,30" fill="#6c4df0"/>
