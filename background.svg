<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ddff"/>
      <stop offset="0.6" stop-color="#d9ecff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="mtnL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb4e8"/>
      <stop offset="1" stop-color="#b9d3f2"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd8a0"/>
      <stop offset="1" stop-color="#6cc08a"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fcf8f"/>
      <stop offset="1" stop-color="#4fae7d"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4df0"/>
      <stop offset="1" stop-color="#8f7bf5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Langit -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="170" r="260" fill="url(#glow)"/>

